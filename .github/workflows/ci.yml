name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - name: cross builds (linux/amd64, js/wasm, c-shared)
        run: |
          GOOS=linux GOARCH=amd64 go build ./...
          GOOS=js GOARCH=wasm go build -o /tmp/eidpades.wasm ./wasm
          go build -buildmode=c-shared -o /tmp/libeidpades.so ./capi
  wasm:
    # pades core-ийг GOOS=js GOARCH=wasm-д Node + wasm_exec-ээр — golden (verifyPage орно) ба Node smoke.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: go test (js/wasm)
        run: |
          export PATH="$PATH:$(go env GOROOT)/lib/wasm"
          GOOS=js GOARCH=wasm go test ./pades/...
      - name: node smoke
        run: go test -count=1 -run NodeSmoke ./wasm
