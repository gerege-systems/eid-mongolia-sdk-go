name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changelog:
    # PR бүр changelog.d/ фрагменттай (эсвэл release нэгтгэл) — changelog.d/README.md.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: scripts/changelog.sh check-pr "${{ github.event.pull_request.base.sha }}"
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      # Production code must import only the hardened github.com/gerege-systems/pdf; upstream digitorus/pdf is for the
      # pdfsign-based tests (go list -deps ignores test imports).
      - name: no upstream digitorus/pdf in production code
        run: "! go list -deps ./... | grep -qx github.com/digitorus/pdf"
      - run: go test -race ./...
      - run: GOOS=linux GOARCH=amd64 go build ./...
      # TEMPORARY: remove before merge (Adobe sample for PR #65)
      - name: seal sample (TEMPORARY)
        if: matrix.go == 'stable'
        run: |
          mkdir -p "$RUNNER_TEMP/seal-sample"
          EID_SAMPLE_DIR="$RUNNER_TEMP/seal-sample" go test ./pades/ -run '^TestSealSampleForAdobe$' -count=1
      # TEMPORARY: remove before merge (Adobe sample for PR #65)
      - if: matrix.go == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: seal-sample
          path: ${{ runner.temp }}/seal-sample/
          if-no-files-found: error
  # TEMPORARY: remove before merge (golden v12 generation for PR #65)
  golden-gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: generate golden v12 (TEMPORARY)
        run: |
          go test ./pades/ -run '^TestGolden$' -update -count=1
          go test ./pades/ -run '^TestValidateGolden$' -update -count=1
          git status --porcelain
          # Existing goldens must stay byte-identical: only the two manifests may change, and only by additions.
          for f in $(git diff --name-only); do
            case "$f" in
              pades/testdata/golden/manifest.json|pades/testdata/validate/manifest.json) ;;
              *) echo "UNEXPECTED CHANGE: $f"; exit 1 ;;
            esac
          done
          removed=$(git diff -U0 -- pades/testdata/golden/manifest.json pades/testdata/validate/manifest.json | grep '^-' | grep -v '^---' | grep -vE '^-\s*}\s*$' || true)
          if [ -n "$removed" ]; then echo "REMOVED/CHANGED LINES:"; echo "$removed"; exit 1; fi
          git add -A pades/testdata
          git diff --cached --stat
          out="$RUNNER_TEMP/golden-v12"
          mkdir -p "$out"
          git diff --cached --name-only > "$out/FILES.txt"
          while read -r f; do mkdir -p "$out/$(dirname "$f")"; cp "$f" "$out/$f"; done < "$out/FILES.txt"
      # TEMPORARY: remove before merge (golden v12 generation for PR #65)
      - uses: actions/upload-artifact@v4
        with:
          name: golden-v12
          path: ${{ runner.temp }}/golden-v12/
          if-no-files-found: error
  # Статик шинжилгээ ба мэдэгдэж буй эмзэг байдал — хувилбар pin хийсэн, олдвор бүр улаан. govulncheck нь stdlib-ийн
  # эмзэг байдлыг ч тоолдог тул сүүлийн patch Go (stable) дээр ажиллана.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...
  # Дайсагнасан PDF: FuzzValidatePDF-ийн seed-үүд `go test`-д unit болж ажилладаг (тогтвортой); энд 30 с mutation
  # нэмнэ. Олдвол pades/testdata/fuzz/-ийн оролтыг artifact болгож хадгална — тэр файлыг commit хийвэл regression seed.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go test ./pades/ -run '^$' -fuzz '^FuzzValidatePDF$' -fuzztime=30s
      # Stamp placement content-stream scanner (PLACEMENT_SPEC.md).
      - run: go test ./pades/internal/core/ -run '^$' -fuzz '^FuzzOccupancy$' -fuzztime=30s
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-failure
          path: |
            pades/testdata/fuzz/
            pades/internal/core/testdata/fuzz/
  # Golden гаралтыг Go-оос хамааралгүй гадны хэрэгслээр шалгана: qpdf (бүтэц) ба pyHanko (INTACT/VALID/TRUSTED,
  # цуцлалт зөвхөн DSS-ээс = LT, timestamp, өөрчлөлтийн ангилал, харагдах widget). Native SDK-ууд эдгээр гаралтыг
  # байт-ижил давтдаг тул энэ нь бүх SDK-ийн гаралтын нийцлийг батална.
  golden-external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: qpdf --check
        run: |
          for f in pades/testdata/golden/output/*.pdf; do
            rc=0; qpdf --check "$f" >/dev/null || rc=$?
            # 3 = зөвхөн анхааруулга (Quartz оролтын «offset 0» объект) — алдаа биш.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "$f: qpdf --check exit $rc"; qpdf --check "$f"; exit 1; fi
          done
      - run: pip install "pyHanko==0.37.0" "pyhanko-certvalidator==0.32.1"
      - name: pyHanko
        run: python -I pades/testdata/golden/ci/pyhanko_check.py pades/testdata/golden
