name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ["1.25", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - run: go test -race ./...
      - run: GOOS=linux GOARCH=amd64 go build ./...
  # Golden гаралтыг Go-оос хамааралгүй гадны хэрэгслээр шалгана: qpdf (бүтэц) ба pyHanko (INTACT/VALID/TRUSTED,
  # цуцлалт зөвхөн DSS-ээс = LT, timestamp, өөрчлөлтийн ангилал, харагдах widget). Native SDK-ууд эдгээр гаралтыг
  # байт-ижил давтдаг тул энэ нь бүх SDK-ийн гаралтын нийцлийг батална.
  golden-external:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y qpdf
      - name: qpdf --check
        run: |
          for f in pades/testdata/golden/output/*.pdf; do
            rc=0; qpdf --check "$f" >/dev/null || rc=$?
            # 3 = зөвхөн анхааруулга (Quartz оролтын «offset 0» объект) — алдаа биш.
            if [ "$rc" -ne 0 ] && [ "$rc" -ne 3 ]; then echo "$f: qpdf --check exit $rc"; qpdf --check "$f"; exit 1; fi
          done
      - run: pip install "pyHanko==0.37.0" "pyhanko-certvalidator==0.32.1"
      - name: pyHanko
        run: python -I pades/testdata/golden/ci/pyhanko_check.py pades/testdata/golden
