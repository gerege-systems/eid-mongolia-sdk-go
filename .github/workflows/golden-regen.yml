# TEMPORARY (PR #61): regenerates pades/testdata/golden on the runner (`go test ./pades -run Golden -update`) and
# uploads it as an artifact. Removed again on the same PR once the regenerated files are committed.
name: golden-regen
on:
  pull_request:
permissions:
  contents: read
jobs:
  regen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - run: go test ./pades -run Golden -update -count=1
      - run: git status --short pades/testdata/golden
      - uses: actions/upload-artifact@v4
        with:
          name: pades-golden
          path: pades/testdata/golden
          if-no-files-found: error
